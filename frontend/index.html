<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Google Fonts: Outfit (headings) + Inter (body) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=Inter:ital,opsz,wght@0,14..32,300..900;1,14..32,300..900&display=swap"
      rel="stylesheet"
    />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />

    <!-- Leaflet CSS -->
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    />
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet-routing-machine@latest/dist/leaflet-routing-machine.css"
    />

    <!-- Primary Meta -->
    <title>AgriSense — Smart Farming Intelligence</title>
    <meta
      name="description"
      content="AgriSense uses AI to help Indian farmers with soil analysis, crop recommendations, market price predictions, and weather-based risk assessment."
    />

    <!-- Open Graph -->
    <meta property="og:title" content="AgriSense — Smart Farming Intelligence" />
    <meta
      property="og:description"
      content="Soil · Crop · Market · Weather — all powered by machine learning."
    />
    <meta property="og:type" content="website" />

    <!-- Theme color for mobile browsers -->
    <meta name="theme-color" content="#1B4332" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
