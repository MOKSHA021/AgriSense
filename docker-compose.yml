version: '3.8'

services:
  frontend:
    build: 
      context: ./frontend
    ports:
      # Map host port 5173 to container's Nginx port 80
      - "5173:80"
    depends_on:
      - backend
      - ml-service
    restart: unless-stopped

  backend:
    build: 
      context: ./backend
    ports:
      - "5000:5000"
    env_file:
      - ./backend/.env
    environment:
      - ML_SERVICE_URL=http://ml-service:8000
    restart: unless-stopped
    # Depending on how your frontend reaches the backend, 
    # it usually just uses localhost:5000 from the browser.

  ml-service:
    build: 
      context: ./ml-service
    ports:
      - "8000:8000"
    restart: unless-stopped
