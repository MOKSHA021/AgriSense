# ── Server ──────────────────────────────────────────────────────────
server.port=${PORT:5000}

# ── MongoDB ─────────────────────────────────────────────────────────
spring.data.mongodb.uri=${MONGO_URI:mongodb://localhost:27017/agrisense}

# ── JWT ─────────────────────────────────────────────────────────────
jwt.secret=${JWT_SECRET:agrisense_jwt_secret_2026}
# 7 days in milliseconds
jwt.expiration=604800000

# ── ML Service ──────────────────────────────────────────────────────
ml.service.url=${ML_SERVICE_URL:http://localhost:8000}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

# ── data.gov.in API ─────────────────────────────────────────────────
data.gov.api-key=${DATA_GOV_API_KEY:}
data.gov.resource-id=${DATA_GOV_RESOURCE_ID:35985678-0d79-46b4-9ed6-6f13308a1d24}

# ── Brevo Email ─────────────────────────────────────────────────────
brevo.api-key=${BREVO_API_KEY:}
brevo.sender-email=${BREVO_SENDER_EMAIL:agrisense@example.com}
brevo.sender-name=AgriSense

# ── Rate Limiting ────────────────────────────────────────────────────
# 100 requests per 15 minutes per IP (same as express-rate-limit config)
rate-limit.capacity=100
rate-limit.refill-minutes=15

# ── Multipart (file uploads) ─────────────────────────────────────────
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB

# ── Logging ──────────────────────────────────────────────────────────
logging.level.com.agrisense=DEBUG
logging.pattern.console=%d{HH:mm:ss} %-5level [%thread] %logger{36} - %msg%n

# ── Jackson ──────────────────────────────────────────────────────────
spring.jackson.serialization.fail-on-empty-beans=false
